[project]
name = "abletocompete-backend"
version = "1.0.0"
description = "AbleToCompete backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.1.0",
    "email-validator==2.1.0",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.22",
    "httpx==0.25.1",
    "celery==5.3.4",
    "redis==5.0.1",
    "alembic==1.12.1",
    "python-dotenv==1.0.0",
    "websockets==12.0",
    "aiofiles==23.2.1",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-bdd>=7.0.0",
    "pytest-asyncio==0.21.1",
    "aiosqlite>=0.19.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "real_llm: marks tests that require ANTHROPIC_API_KEY",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.25.1",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-bdd>=7.0.0",
    "testcontainers[postgres]>=4.8.0",
]

